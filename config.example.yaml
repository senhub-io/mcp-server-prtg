# MCP Server PRTG - Configuration Example
# ==========================================
# This is a fully documented example configuration file for mcp-server-prtg.
# Copy this file to your desired location and customize it for your environment.
#
# For more information, see: https://github.com/senhub-io/mcp-server-prtg

# Configuration file format version (do not modify)
config_version: 1

# Server Configuration
# ====================
server:
  # API Key for authentication (required)
  # This key must be provided by MCP clients in the Authorization header.
  # You may type a clear-text value here: it is encrypted in place
  # (enc:dpapi:... on Windows, enc:aes:... on Linux) at the next service start.
  api_key: "your-secure-api-key-here"

  # Network bind address
  # - "0.0.0.0" binds to all interfaces (default)
  # - "127.0.0.1" binds to localhost only (more secure for local-only access)
  bind_address: "0.0.0.0"

  # Server port (default: 8443 for HTTPS)
  port: 8443

  # Enable TLS/SSL encryption (strongly recommended for production)
  enable_tls: true

  # TLS certificate file path (required if enable_tls is true)
  cert_file: "/path/to/server.crt"

  # TLS private key file path (required if enable_tls is true)
  key_file: "/path/to/server.key"

  # Allow custom SQL queries (disabled by default; when enabled, read-only
  # with a timeout, a row cap and a deny-list of credential tables)
  allow_custom_queries: false

# Database Configuration
# ======================
# The server reads the PostgreSQL TARGET database of PRTG Data Exporter 2026.x
# (default name prtg_data_exporter_collection), NOT the Data Exporter
# configuration database prtg_data_exporter.
database:
  # PostgreSQL server hostname or IP address
  host: "localhost"

  # PostgreSQL server port (default: 5432)
  port: 5432

  # Target database filled by PRTG Data Exporter
  name: "prtg_data_exporter_collection"

  # Dedicated read-only role (recommended). Create it on the target database:
  #   CREATE ROLE mcp_prtg_reader LOGIN;
  #   \\password mcp_prtg_reader
  #   GRANT CONNECT ON DATABASE prtg_data_exporter_collection TO mcp_prtg_reader;
  #   -- inside prtg_data_exporter_collection:
  #   GRANT USAGE ON SCHEMA public TO mcp_prtg_reader;
  #   GRANT SELECT ON ALL TABLES IN SCHEMA public TO mcp_prtg_reader;
  #   ALTER DEFAULT PRIVILEGES FOR ROLE prtg_data_exporter_user_td IN SCHEMA public
  #     GRANT SELECT ON TABLES TO mcp_prtg_reader;
  user: "mcp_prtg_reader"

  # Database password
  # You may type a clear-text value here: it is encrypted in place
  # (enc:dpapi:... on Windows, enc:aes:... on Linux) at the next service start.
  # Alternatively use the PRTG_DB_PASSWORD environment variable.
  password: "your-secure-password-here"

  # SSL mode for database connection
  # Options: "disable", "require", "verify-ca", "verify-full"
  sslmode: "require"

# PRTG API v2 (optional)
# ======================
# Enable to use the PRTG API v2 as an additional source (real-time values,
# fallback when the Data Exporter export is stale). The API v2 must be
# activated on the PRTG core server (ports 1616/1615 and 23580).
prtg:
  enabled: false

  # PRTG base URL with scheme and API port
  base_url: "https://prtg.example.com:1616"

  # PRTG API key of type Scripting with read access.
  # You may type a clear-text value here: it is encrypted in place
  # (enc:dpapi:... on Windows, enc:aes:... on Linux) at the next service start.
  # Alternatively use the PRTG_API_TOKEN environment variable.
  api_token: "your-prtg-api-token-here"

  # Request timeout in seconds
  timeout: 30

  # Verify the PRTG TLS certificate
  verify_ssl: true

# Logging Configuration
# =====================
logging:
  # Log level: debug, info, warn, error
  level: "info"

  # Log file path
  file: "/var/log/mcp-server-prtg/mcp-server-prtg.log"

  # Maximum size of each log file in megabytes before rotation
  max_size_mb: 10

  # Maximum number of old log files to retain
  max_backups: 5

  # Maximum age of log files in days
  max_age_days: 30

  # Compress rotated log files using gzip
  compress: true
