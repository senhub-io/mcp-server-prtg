name: main-release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute production version
        id: get_version
        run: |
          LATEST="$(git describe --tags --abbrev=0 HEAD)"
          VERSION="${LATEST%%-*}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: cannot derive a production version from tag '$LATEST'" >&2
            exit 1
          fi
          # A merge without a new beta tag (documentation, release tooling)
          # derives an already released version: nothing to release.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::$VERSION is already released; no release for this merge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.get_version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build Windows and Linux binaries
        if: steps.get_version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.tag }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GO_VERSION=$(go env GOVERSION | sed 's/^go//')
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitHash=${COMMIT}' -X 'main.BuildTime=${DATE}' -X 'main.GoVersion=${GO_VERSION}'"
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            STAGE="stage/${GOOS}-${GOARCH}"
            EXE="mcp-server-prtg"
            [ "$GOOS" = windows ] && EXE="mcp-server-prtg.exe"
            mkdir -p "$STAGE"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDFLAGS" -o "$STAGE/$EXE" ./cmd/server
            cp README.md LICENSE config.example.yaml "$STAGE/"
            if [ "$GOOS" = windows ]; then
              (cd "$STAGE" && zip -q -9 "../../dist/mcp-server-prtg-${VERSION}-windows-amd64.zip" ./*)
            else
              tar -C "$STAGE" -czf "dist/mcp-server-prtg-${VERSION}-${GOOS}-${GOARCH}.tar.gz" .
            fi
          done
          ./stage/linux-amd64/mcp-server-prtg --version
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Create draft release
        if: steps.get_version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "MCP Server PRTG ${{ steps.get_version.outputs.tag }}"
          files: dist/*
          generate_release_notes: true
          prerelease: false
          draft: true

      - name: Write summary
        if: steps.get_version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          {
            echo "## Draft release $TAG created (not public)"
            echo "Run \`scripts/sign-release.sh $TAG\` on the signing Mac, then publish the draft."
          } >> "$GITHUB_STEP_SUMMARY"
