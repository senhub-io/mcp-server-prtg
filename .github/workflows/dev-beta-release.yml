name: Dev Beta Release
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  create_beta_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag is on dev
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --all
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          if git branch -r --contains "$TAG_COMMIT" | grep -q "origin/dev"; then
            echo "Tag $TAG is on dev, publishing a beta release"
          else
            echo "Tag $TAG is not on dev, skipping"
            exit 1
          fi

      - name: Get tag version
        id: get_version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows and Linux binaries
        env:
          VERSION: ${{ steps.get_version.outputs.tag }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GO_VERSION=$(go env GOVERSION | sed 's/^go//')
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitHash=${COMMIT}' -X 'main.BuildTime=${DATE}' -X 'main.GoVersion=${GO_VERSION}'"
          mkdir -p dist

          # The executable keeps the same name on every platform: the MSI,
          # the service definitions and the documentation refer to it.
          for target in windows/amd64 linux/amd64 linux/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            STAGE="stage/${GOOS}-${GOARCH}"
            EXE="mcp-server-prtg"
            [ "$GOOS" = windows ] && EXE="mcp-server-prtg.exe"
            mkdir -p "$STAGE"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDFLAGS" -o "$STAGE/$EXE" ./cmd/server
            cp README.md LICENSE config.example.yaml "$STAGE/"
            if [ "$GOOS" = windows ]; then
              (cd "$STAGE" && zip -q -9 "../../dist/mcp-server-prtg-${VERSION}-windows-amd64.zip" ./*)
            else
              tar -C "$STAGE" -czf "dist/mcp-server-prtg-${VERSION}-${GOOS}-${GOARCH}.tar.gz" .
            fi
          done

          ./stage/linux-amd64/mcp-server-prtg --version
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -lh dist

      - name: Create beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Beta ${{ steps.get_version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          prerelease: true

  windows_msi:
    needs: create_beta_release
    permissions:
      contents: write
    uses: ./.github/workflows/windows-msi.yml
    with:
      version: ${{ needs.create_beta_release.outputs.tag }}
      release_tag: ${{ needs.create_beta_release.outputs.tag }}
    secrets: inherit
