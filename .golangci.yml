version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errname
    - exhaustive
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - mnd
    - nakedret
    - nestif
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - wsl
  disable:
    - cyclop
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - goheader
    - gomoddirectives
    - gomodguard
    - grouper
    - importas
    - interfacebloat
    - ireturn
    - maintidx
    - makezero
    - nilerr
    - nilnil
    - nlreturn
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - thelper
    - varnamelen
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 15
      package-average: 10
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*github.com/lib/pq.Conn).Close
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
      severity: medium
      confidence: medium
      config:
        global:
          audit: true
          nosec: false
    govet:
      disable:
        - fieldalignment
      enable-all: true
    lll:
      line-length: 140
      tab-width: 4
    misspell:
      locale: US
      ignore-rules:
        - prtg
        - senhub
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
      initialisms:
        - ACL
        - API
        - ASCII
        - CPU
        - CSS
        - DNS
        - EOF
        - GUID
        - HTML
        - HTTP
        - HTTPS
        - ID
        - IP
        - JSON
        - QPS
        - RAM
        - RPC
        - SLA
        - SMTP
        - SQL
        - SSH
        - TCP
        - TLS
        - TTL
        - UDP
        - UI
        - GID
        - UID
        - UUID
        - URI
        - URL
        - UTF8
        - VM
        - XML
        - XMPP
        - XSRF
        - XSS
        - MCP
        - PRTG
      dot-import-whitelist:
        - fmt
      http-status-code-whitelist:
        - "200"
        - "400"
        - "404"
        - "500"
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gochecknoglobals
          - goconst
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - mnd
        path: internal/types/models.go
      - linters:
          - cyclop
          - gocyclo
        path: internal/handlers/
      - linters:
          - funlen
          - gocyclo
        path: internal/database/queries.go
      - linters:
          - gochecknoglobals
        path: cmd/server/main.go
      - linters:
          - gochecknoinits
        path: cmd/
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  new: false
  fix: false
severity:
  default: error
  rules:
    - linters:
        - dupl
      severity: info
    - linters:
        - mnd
      severity: warning
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/senhub-io/mcp-server-prtg
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
